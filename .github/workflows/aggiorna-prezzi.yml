name: Aggiorna prezzi carburanti

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Scarica CSV prezzi regionali
        run: |
          mkdir -p dati
          curl -fsSL "https://www.mimit.gov.it/images/stories/carburanti/MediaRegionaleStradale.csv" -o dati/prezzi_regionali.csv -A "OsservaCarburanti/1.0"

      - name: Scarica CSV media nazionale autostrade
        run: |
          curl -fsSL "https://www.mimit.gov.it/images/stories/carburanti/MediaNazionaleAutostradale.csv" -o dati/prezzi_autostrade.csv -A "OsservaCarburanti/1.0" || echo "autostrade non disponibili, continuo"

      - name: Scarica anagrafica e prezzi puntuali di tutti gli impianti
        run: |
          curl -fsSL "https://www.mimit.gov.it/images/exportCSV/anagrafica_impianti_attivi.csv" -o /tmp/anagrafica.csv -A "OsservaCarburanti/1.0"
          curl -fsSL "https://www.mimit.gov.it/images/exportCSV/prezzo_alle_8.csv" -o /tmp/prezzi_puntuali.csv -A "OsservaCarburanti/1.0"

      - name: Comprimi in impianti.json
        run: |
          python3 costruisci_impianti.py /tmp/anagrafica.csv /tmp/prezzi_puntuali.csv dati/impianti.json
          ls -lh dati/impianti.json

      - name: Calcola indice di rischio prezzo carburanti (Brent + EUR/USD)
        run: |
          python3 aggiorna_rischio.py dati/rischio.json
        continue-on-error: true

      - name: Verifica che i file non siano vuoti
        run: |
          test -s dati/prezzi_regionali.csv || (echo "CSV regionale vuoto, aborto" && exit 1)
          test -s dati/impianti.json || (echo "impianti.json vuoto, aborto" && exit 1)

      - name: Commit e push se ci sono modifiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dati/
          git diff --quiet --cached || git commit -m "Aggiornamento prezzi carburanti"
          git push
